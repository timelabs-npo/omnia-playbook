name: ARIA P0 Omnia producer

permissions:
  contents: read

on:
  push:
    branches:
      - proposal/aria-p0-replace-file
  pull_request:

jobs:
  compile-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: Install producer dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Compile P0 OMNA bundle
        run: |
          python3 tools/compile_omnia_bus.py             --manifest bus/fixtures/p0-replace-file.bundle.json             --output artifacts/p0-replace-file.omnb             --inspect-json artifacts/p0-replace-file.inspect.json
          cat artifacts/p0-replace-file.inspect.json
      - name: Verify exact source evidence binding
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          src = pathlib.Path("checks/p0/invariant-replace-file.json").read_bytes()
          manifest = json.loads(pathlib.Path("bus/fixtures/p0-replace-file.bundle.json").read_text())
          expected = "sha256:" + hashlib.sha256(src).hexdigest()
          actual = manifest["documents"][0]["evidence_ids"][0]
          assert actual == expected, (actual, expected)
          print("evidence_binding=PASS", expected)
          PY
