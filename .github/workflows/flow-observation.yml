name: Flow Observation semantic fixtures
on:
  pull_request:
  push:
    branches: [evolution/network-flow-semantic-redteam-v1]
permissions:
  contents: read
jobs:
  semantic-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install jsonschema==4.26.0 rfc3339-validator==0.1.4
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
