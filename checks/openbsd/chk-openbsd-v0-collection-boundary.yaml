id: chk-openbsd-v0-collection-boundary
invariant: inv-openbsd-sealed-brick-bounded-control
command: ./checks/openbsd/inspect_openbsd_v0.sh --collect
platform: openbsd
requires:
  - awk
  - uname
  - ifconfig
  - route
  - pfctl
  - rcctl
  - sysctl
  - cat
  - grep
timeout: 20
expected_exit_code: 0
expected_output:
  contains:
    - contract_version=v0
    - output_mode=public_minimized
    - result=PASS
failure_message: OpenBSD bounded v0 collection failed or returned a non-pass result.
remediation_playbook: playbooks/openbsd-sealed-brick/README.md
