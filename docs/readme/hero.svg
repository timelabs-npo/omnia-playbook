<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">Omnia Playbook — the Kouretes protocol</title><desc id="d">A bright circular systems diagram inspired by the shield dance of the Kouretes, showing invariants, adapters, checks, and playbooks.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7df"/><stop offset=".45" stop-color="#fffef8"/><stop offset="1" stop-color="#d9f9ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".12"/></filter></defs>
<rect width="1600" height="760" rx="42" fill="url(#bg)"/><g transform="translate(1070 380)" fill="none" stroke="#102446" stroke-width="5" filter="url(#s)"><circle r="250" fill="#fff"/><circle r="188" stroke="#00b8d9" stroke-width="28" stroke-dasharray="120 35"/><circle r="126" stroke="#ff4e68" stroke-width="24" stroke-dasharray="70 25"/><circle r="70" fill="#ffe55e"/></g>
<g stroke="#102446" stroke-width="5"><path d="M1070 130v500M820 380h500M894 204l352 352M894 556l352-352" opacity=".35"/></g>
<g font-family="system-ui,Segoe UI,sans-serif" fill="#102446"><text x="80" y="110" font-size="34" font-weight="800" letter-spacing="5">OMNIA PLAYBOOK</text><text x="80" y="210" font-size="88" font-weight="950">DANCE THE CHECKS</text><text x="80" y="296" font-size="88" font-weight="950">BEFORE YOU TOUCH</text><text x="80" y="382" font-size="88" font-weight="950">REALITY.</text><text x="84" y="450" font-size="27" font-weight="700">ΚΟΥΡΗΤΕΣ / invariants → adapters → checks → playbooks</text><text x="84" y="505" font-size="22">Read-only diagnostics first. Mutation only by an explicit operator or future qualified executor.</text><text x="84" y="590" font-size="20" font-weight="800" fill="#ff4e68">CRONUS ≠ CHRONOS.</text><text x="298" y="590" font-size="20">Ambiguity is a bug.</text></g>
<g font-family="ui-monospace,monospace" font-size="18" font-weight="800" fill="#102446"><text x="1018" y="83">INVARIANT</text><text x="1324" y="386">ADAPTER</text><text x="1018" y="690">CHECK</text><text x="724" y="386">PLAYBOOK</text></g></svg>